name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-security:
    name: Python 3.12, Security Lint, MCP stdio & PostgreSQL 17 FORCE RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_ephemeral
          POSTGRES_DB: ledgerguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerguard_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --dev

      - name: Ruff lint & security rules
        run: uv run ruff check src tests scripts

      - name: Mypy strict static typing
        run: uv run mypy --strict src

      - name: Architectural, AST float & SQL RLS invariant linter (self-test + SARIF)
        run: |
          uv run python3 scripts/security-lint.py --self-test
          uv run python3 scripts/security-lint.py --sarif results.sarif

      - name: Archive SARIF security lint artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-lint-sarif
          path: results.sarif
          retention-days: 14

      - name: Strict dependency CVE audit (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-groups -o /tmp/lg-reqs.txt
          uv run pip-audit --strict --no-deps -r /tmp/lg-reqs.txt
          rm -f /tmp/lg-reqs.txt

      - name: Native MCP stdio server handshake check
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | uv run ledger-guard-mcp \
            | python3 -c 'import json, sys; lines = [json.loads(l) for l in sys.stdin if l.strip()]; assert len(lines) == 2 and len(lines[1]["result"]["tools"]) == 7, lines'

      - name: Pytest suite (unit, contract parity & live PostgreSQL 17 FORCE RLS)
        env:
          LEDGER_GUARD_TEST_PG_DSN: postgresql://postgres:postgres_ci_ephemeral@127.0.0.1:5432/ledgerguard_test
        run: uv run pytest -v
