[project]
name = "ledger-guard"
version = "0.1.0"
description = "Hexagonal Python 3.12 commercial order pricing, exact Fraction margin-approval engine & multi-tenant security reference (PostgreSQL 17 FORCE RLS, FastAPI, MCP tools)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Murilo Felisberto" }
]
keywords = [
    "erp",
    "fintech",
    "pricing-engine",
    "hexagonal-architecture",
    "postgresql",
    "row-level-security",
    "fastapi",
    "mcp",
    "multi-tenant",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "uvicorn>=0.32.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
mypy_path = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
