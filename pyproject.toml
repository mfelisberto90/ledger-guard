[project]
name = "ledger-guard"
version = "0.3.0"
description = "Hexagonal Python 3.12 commercial order pricing, exact Fraction margin-approval engine & multi-tenant security reference (PostgreSQL 17 FORCE RLS, FastAPI, MCP stdio & HTTP tools)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Murilo Felisberto" }
]
keywords = [
    "erp",
    "fintech",
    "pricing-engine",
    "hexagonal-architecture",
    "postgresql",
    "row-level-security",
    "fastapi",
    "mcp",
    "model-context-protocol",
    "multi-tenant",
]
dependencies = [
    "anyio>=4.14.2,<5.0.0",
    "fastapi>=0.162.0,<1.0.0",
    "h11>=0.16.0,<1.0.0",
    "pydantic>=2.14.0,<3.0.0",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn>=0.54.0,<1.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.9,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/mfelisberto90/ledger-guard"
Repository = "https://github.com/mfelisberto90/ledger-guard"
Issues = "https://github.com/mfelisberto90/ledger-guard/issues"
Changelog = "https://github.com/mfelisberto90/ledger-guard/blob/main/CHANGELOG.md"
Security = "https://github.com/mfelisberto90/ledger-guard/blob/main/SECURITY.md"

[project.scripts]
ledger-guard-mcp = "ledger_guard.mcp.stdio_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0,<3.0.0",
    "mypy>=1.20.0,<3.0.0",
    "pip-audit>=2.10.0,<3.0.0",
    "psycopg[binary]>=3.3.9,<4.0.0",
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.17.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.26.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_guard"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/ledger_guard",
    "sql",
    "CHANGELOG.md",
    "LICENSE",
    "PRIVACY.md",
    "README.md",
    "SECURITY.md",
    "pyproject.toml",
    "server.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
mypy_path = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
